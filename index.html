<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Program Impact Pre/Post Assessment</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 650px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    .card { background: #f9f9f9; padding: 1.5rem; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 1rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    input[type="text"], select, textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #0066cc; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #999; }
    .status-banner { padding: 0.5rem 1rem; border-radius: 4px; margin-bottom: 1rem; display: none; }
    .offline { background: #fff3cd; color: #856404; }
    .online { background: #d4edda; color: #155724; }
  </style>
</head>
<body>

  <h2>Program Skills Assessment</h2>
  <div id="connectionStatus" class="status-banner"></div>

  <form id="quizForm" class="card">
    <div class="field">
      <label for="studentName">Student Full Name</label>
      <input type="text" id="studentName" required />
    </div>

    <div class="field">
      <label for="cohort">Cohort ID / Class</label>
      <input type="text" id="cohort" placeholder="e.g. Fall 2026 - Section A" required />
    </div>

    <div class="field">
      <label for="assessmentType">Assessment Stage</label>
      <select id="assessmentType" required>
        <option value="">-- Select Stage --</option>
        <option value="Pre">Pre-Assessment (Day 1)</option>
        <option value="Post">Post-Assessment (Final Day)</option>
      </select>
    </div>

    <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #eee;" />

    <!-- Question 1: Multiple Choice -->
    <div class="field">
      <label>1. What primary method is used to minimize aerodynamic drag on an airfoil?</label>
      <label><input type="radio" name="q1" value="Streamlining" required> Streamlining the trailing edge</label><br>
      <label><input type="radio" name="q1" value="Roughness"> Increasing surface roughness</label><br>
      <label><input type="radio" name="q1" value="Thickening"> Maximizing frontal thickness</label>
    </div>

    <!-- Question 2: Short Answer -->
    <div class="field">
      <label for="q2">2. Briefly describe how lifting force is generated relative to angle of attack.</label>
      <textarea id="q2" rows="3" required></textarea>
    </div>

    <button type="submit" id="submitBtn">Submit Assessment</button>
  </form>

  <script>
    const GOOGLE_SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';
    const answerKey = { q1: 'Streamlining' }; // Correct answer for scoring MCQs

    // Handle offline status detection
    function updateOnlineStatus() {
      const banner = document.getElementById('connectionStatus');
      if (!navigator.onLine) {
        banner.style.display = 'block';
        banner.className = 'status-banner offline';
        banner.textContent = 'You are currently offline. Submissions will be saved locally and synced when connection returns.';
      } else {
        banner.style.display = 'none';
        syncOfflineQueue();
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // Form Submission Logic
    document.getElementById('quizForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const q1Val = document.querySelector('input[name="q1"]:checked')?.value;
      const q2Val = document.getElementById('q2').value;

      // Auto-score multiple choice questions
      let score = 0;
      if (q1Val === answerKey.q1) score += 1;

      const payload = {
        studentName: document.getElementById('studentName').value,
        cohort: document.getElementById('cohort').value,
        assessmentType: document.getElementById('assessmentType').value,
        score: score,
        total: 1, // Number of scored multiple choice questions
        answers: { q1: q1Val, q2: q2Val }
      };

      if (navigator.onLine) {
        await sendData(payload);
      } else {
        saveLocally(payload);
        alert('Submitted offline! Data stored locally and will sync when reconnected.');
      }

      e.target.reset();
    });

    async function sendData(data) {
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Apps script redirect handling
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        alert('Assessment successfully recorded!');
      } catch (err) {
        saveLocally(data);
        alert('Connection error. Saved locally.');
      }
    }

    function saveLocally(data) {
      const queue = JSON.parse(localStorage.getItem('offlineQueue') || '[]');
      queue.push(data);
      localStorage.setItem('offlineQueue', JSON.stringify(queue));
    }

    async function syncOfflineQueue() {
      const queue = JSON.parse(localStorage.getItem('offlineQueue') || '[]');
      if (queue.length === 0) return;

      console.log(`Syncing ${queue.length} offline submissions...`);
      for (const item of queue) {
        await sendData(item);
      }
      localStorage.removeItem('offlineQueue');
      alert(`Successfully synced ${queue.length} offline submission(s)!`);
    }
  </script>
</body>
</html>
